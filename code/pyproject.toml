[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ictc-network-control"
version = "0.1.0"
description = "Intervention-Conditioned Telemetry Contracts for causally admissible autonomous network control."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "grpcio>=1.70,<2",
  "hydra-core>=1.3,<2",
  "matplotlib>=3.10,<4",
  "networkx>=3.4,<4",
  "numpy>=2.2,<3",
  "ortools>=9.12,<10",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<1",
  "structlog>=25,<26",
  "typer>=0.15,<1",
]

[project.scripts]
ictc = "ictc.cli:app"

[dependency-groups]
dev = [
  "grpcio-tools>=1.70,<2",
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ictc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
branch = true
source = ["ictc.domain", "ictc.protocol", "ictc.causal", "ictc.contract", "ictc.controller", "ictc.simulation", "ictc.datasets", "ictc.baselines", "ictc.pilot", "ictc.oracle", "ictc.formal"]
omit = ["src/ictc/proto/*", "src/ictc/cli.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
exclude = ["^src/ictc/proto/"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/ictc/proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
per-file-ignores = { "src/ictc/cli/__init__.py" = ["B008"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
